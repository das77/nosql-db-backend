services:
  api:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    environment:
      # Overrides whatever the local .env holds. Host-mode dev needs a localhost
      # URI; the container needs Compose's internal DNS name for the mongo service.
      # environment: takes precedence over env_file:, so this always wins here.
      MONGO_URI: mongodb://mongo:27017/app
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # depends_on alone only waits for the container to start, not for Mongo to
      # accept connections — connectDB() exits 1 on first failure, so the API
      # would lose the race on a cold start.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
